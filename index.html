<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Leaderless Band</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0f1a;color:#e6e9f2;font:14px system-ui,Segoe UI,sans-serif;display:flex;height:100vh;overflow:hidden}
#stage{flex:1;position:relative;min-width:0}
canvas{width:100%;height:100%;display:block}
#side{width:320px;padding:16px;background:#111729;border-left:1px solid #222b45;overflow:auto}
h1{font-size:18px;margin:0 0 2px}
.sub{color:#8a94b3;font-size:12px;margin-bottom:12px}
button{background:#1c2542;color:#e6e9f2;border:1px solid #2d3a66;border-radius:6px;padding:7px 10px;margin:3px 3px 3px 0;cursor:pointer;font-size:13px}
button:hover{background:#26335f}
button.on{background:#3b5bdb;border-color:#5c7cff}
label{display:block;margin:8px 0 2px;color:#aab3d0;font-size:12px}
input[type=range]{width:100%}
.stat{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #1d2644}
.stat b{font-variant-numeric:tabular-nums}
#log{font-size:12px;color:#9aa5c8;margin-top:10px;line-height:1.5;min-height:100px}
#log div{border-left:2px solid #2d3a66;padding-left:6px;margin:2px 0}
#hint{position:absolute;left:14px;bottom:12px;color:#6f7aa0;font-size:12px}
#start{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#0b0f1acc;z-index:5}
#start button{font-size:20px;padding:16px 28px;background:#3b5bdb}
</style></head><body>
<div id="stage"><canvas id="cv"></canvas>
<div id="hint">click a node to kill/revive it, click a link to cut/restore it</div>
<div id="start"><button id="go">▶ Start the band</button></div></div>
<div id="side">
<h1>Leaderless Band</h1>
<div class="sub">8 musicians, no conductor. Each decides alone from what it hears from neighbours.</div>
<div>
<button id="bSplit">Split network</button>
<button id="bDis">Split + disagree</button>
<button id="bHeal">Heal all</button>
<button id="bKill">Kill random</button>
<button id="bKey">Change key</button>
<button id="bStorm">Storm mode</button>
<button id="bMute">Mute</button>
</div>
<label>Packet loss: <span id="lossV">10</span>%</label><input id="loss" type="range" min="0" max="85" value="10">
<label>Latency: <span id="latV">80</span> ms</label><input id="lat" type="range" min="10" max="400" value="80">
<div style="margin-top:12px">
<div class="stat"><span>Coherence (same key + in step)</span><b id="sCoh">-</b></div>
<div class="stat"><span>Network partitions</span><b id="sPart">-</b></div>
<div class="stat"><span>Roles covered</span><b id="sRoles">-</b></div>
<div class="stat"><span>Musicians alive</span><b id="sAlive">-</b></div>
</div>
<div id="log"></div>
</div>
<script>
'use strict';
// ---------- config ----------
const N=8, STEP=0.14, K=0.35, BAR=16;
const MOODS=[
 {name:'C minor',root:48,scale:[0,2,3,5,7,8,10],hue:260},
 {name:'D dorian',root:50,scale:[0,2,3,5,7,9,10],hue:190},
 {name:'F lydian',root:53,scale:[0,2,4,6,7,9,11],hue:45},
 {name:'A phrygian',root:45,scale:[0,1,3,5,7,8,10],hue:350},
 {name:'G mixolydian',root:55,scale:[0,2,4,5,7,9,10],hue:130}];
const PROG=[0,5,3,4];
const ROLES=['bass','pad','arp','lead','drums'];
const RCOL={bass:'#ff7a59',pad:'#7aa2ff',arp:'#4fe0b0',lead:'#ffd166',drums:'#d98cff'};
const edges=[]; for(let i=0;i<N;i++){edges.push([i,(i+1)%N]);} for(let i=0;i<N/2;i++){edges.push([i,i+N/2]);}
const cut=new Set(); const ek=(a,b)=>a<b?a+'-'+b:b+'-'+a;
const adj=Array.from({length:N},()=>[]); edges.forEach(([a,b])=>{adj[a].push(b);adj[b].push(a);});
const rnd=Math.random, pick=a=>a[Math.floor(rnd()*a.length)];
let loss=0.1, lat=0.08, muted=false, storm=false;
const now=()=>performance.now()/1000;

// ---------- state ----------
const nodes=[];
const t0=now();
for(let i=0;i<N;i++){
  const detune=(rnd()-0.5)*0.06;
  nodes.push({id:i,alive:true,detune,interval:STEP/(1+detune),n:Math.floor(rnd()*60),
    next:t0+rnd()*STEP,mood:{v:0,who:0,idx:0},active:0,role:pick(ROLES),view:{},heard:[],
    lead:9,lastPitch:null,pan:Math.cos(-Math.PI/2+2*Math.PI*i/N)*0.7,pulse:0,phase:0});
}
const queue=[], packets=[], ripples=[];
const logs=[]; function log(s){logs.unshift(s); if(logs.length>9)logs.pop(); document.getElementById('log').innerHTML=logs.map(x=>'<div>'+x+'</div>').join('');}

// ---------- audio ----------
let ctx=null,master,noiseBuf;
function initAudio(){
  ctx=new (window.AudioContext||window.webkitAudioContext)();
  master=ctx.createGain(); master.gain.value=0.7;
  const comp=ctx.createDynamicsCompressor(); master.connect(comp); comp.connect(ctx.destination);
  const d=ctx.createDelay(1); d.delayTime.value=0.28; const fb=ctx.createGain(); fb.gain.value=0.35; const wet=ctx.createGain(); wet.gain.value=0.25;
  master.connect(d); d.connect(fb); fb.connect(d); d.connect(wet); wet.connect(comp);
  noiseBuf=ctx.createBuffer(1,ctx.sampleRate*0.5,ctx.sampleRate); const ch=noiseBuf.getChannelData(0); for(let i=0;i<ch.length;i++)ch[i]=rnd()*2-1;
}
const mtof=m=>440*Math.pow(2,(m-69)/12);
function tone(a,midi,dur,type,vol,att=0.005){
  if(!ctx||muted)return; const t=ctx.currentTime+0.03;
  const o=ctx.createOscillator(),g=ctx.createGain(),p=ctx.createStereoPanner();
  o.type=type;o.frequency.value=mtof(midi);p.pan.value=a.pan;
  g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol,t+att);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(p);p.connect(master);o.start(t);o.stop(t+dur+0.05);
}
function kick(a,vol){
  if(!ctx||muted)return; const t=ctx.currentTime+0.03;
  const o=ctx.createOscillator(),g=ctx.createGain(),p=ctx.createStereoPanner();p.pan.value=a.pan;
  o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(40,t+0.12);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.25);
  o.connect(g);g.connect(p);p.connect(master);o.start(t);o.stop(t+0.3);
}
function hiss(a,dur,vol,freq){
  if(!ctx||muted)return; const t=ctx.currentTime+0.03;
  const s=ctx.createBufferSource();s.buffer=noiseBuf;const f=ctx.createBiquadFilter();f.type='highpass';f.frequency.value=freq;
  const g=ctx.createGain(),p=ctx.createStereoPanner();p.pan.value=a.pan;
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f);f.connect(g);g.connect(p);p.connect(master);s.start(t);s.stop(t+dur+0.02);
}

// ---------- music (each node decides locally) ----------
function degToMidi(m,d){const sc=MOODS[m].scale;return MOODS[m].root+12*Math.floor(d/7)+sc[((d%7)+7)%7];}
function density(a){const t=now();let c=1;for(const id in a.view){if(+id!==a.id&&a.view[id].role===a.role&&t-a.view[id].t<2)c++;}return 1/c;}
function play(a){
  const m=a.active, s=a.n%BAR, c=PROG[Math.floor(a.n/BAR)%4], dens=density(a), I=a.interval;
  const ripple=(col)=>{a.pulse=1;ripples.push({id:a.id,t:now(),col});};
  switch(a.role){
    case 'drums':
      if(s%8===0){kick(a,0.5);ripple(RCOL.drums);}
      if((s===4||s===12)&&rnd()<0.9){hiss(a,0.12,0.18,1800);ripple(RCOL.drums);}
      if(s%2===1&&rnd()<0.8*(0.4+0.6*dens)){hiss(a,0.04,0.07,7000);}
      break;
    case 'bass':
      if([0,6,8,12].includes(s)||(s===14&&rnd()<0.5)){
        const d=(s===14)?c+4:c; const p=degToMidi(m,d)-12; tone(a,p,I*3,'triangle',0.35); ripple(RCOL.bass);}
      break;
    case 'pad':
      if(s===0){[0,2,4].forEach(k=>tone(a,degToMidi(m,c+k)+12*(k===4?0:0),I*BAR*0.95,'sine',0.12*(0.6+0.4*dens),0.5));ripple(RCOL.pad);}
      break;
    case 'arp':
      if(s%2===0&&rnd()<0.5+0.45*dens){const k=[0,2,4,2][(s/2)%4]; const p=degToMidi(m,c+k)+12; a.lastPitch=p;
        tone(a,p,I*2.2,'triangle',0.16);ripple(RCOL.arp);}
      break;
    case 'lead':
      if(rnd()<0.38*(0.5+0.5*dens)){
        let d=a.lead+pick([-2,-1,-1,0,1,1,2]); d=Math.max(c+5,Math.min(c+13,d));
        let p=degToMidi(m,d); const t=now(); a.heard=a.heard.filter(h=>t-h.t<0.8);
        if(a.heard.some(h=>((h.p-p)%12+12)%12===0)){d+=1;p=degToMidi(m,d);} // dodge neighbours' pitch
        a.lead=d;a.lastPitch=p;tone(a,p,I*3.5,'sine',0.22,0.01);tone(a,p+0.07,I*3.5,'triangle',0.08,0.01);ripple(RCOL.lead);}
      break;
  }
}

// ---------- gossip ----------
function connected(a,b){return !cut.has(ek(a,b))&&nodes[a].alive&&nodes[b].alive;}
function broadcast(a){
  const t=now();
  const view=[[a.id,a.role,0]]; for(const id in a.view){const e=a.view[id];if(+id!==a.id&&t-e.t<2.5)view.push([+id,e.role,t-e.t]);}
  const msg={id:a.id,n:a.n,rem:a.next-t,mood:{...a.mood},role:a.role,pitch:a.lastPitch,view};
  for(const b of adj[a.id]){
    if(!connected(a.id,b))continue;
    if(rnd()<loss)continue;
    const L=lat*(0.5+rnd());
    queue.push({at:t+L,to:b,msg,from:a.id});
    packets.push({from:a.id,to:b,t0:t,t1:t+L,col:RCOL[a.role]});
  }
}
const better=(x,y)=>x.v>y.v||(x.v===y.v&&x.who>y.who);
function receive(a,msg){
  const t=now();
  // membership view (gossiped)
  for(const [id,role,age] of msg.view){if(id===a.id)continue;const ts=t-age-lat;if(!a.view[id]||a.view[id].t<ts)a.view[id]={role,t:ts};}
  // key/mood register: highest (version, author) wins, so partitions converge after healing
  if(better(msg.mood,a.mood)){a.mood={...msg.mood};log(`node ${a.id} adopts <b>${MOODS[msg.mood.idx].name}</b> (v${msg.mood.v} from node ${msg.mood.who})`);}
  if(msg.pitch!=null)a.heard.push({p:msg.pitch,t});
  // tempo/step sync
  const theirNext=t+msg.rem-lat, I=a.interval, diff=msg.n-a.n;
  if(diff>=2){a.n=msg.n;a.next=theirNext;}
  else if(diff>-2){const target=theirNext+(a.n-msg.n)*I;a.next+=K*(target-a.next);}
}
function step(a,t){
  a.n++; a.next+=a.interval; if(a.next<t)a.next=t+a.interval*0.5;
  if(a.n%BAR===0){
    a.active=a.mood.idx;
    if(rnd()<0.005){proposeKey(a);}
  }
  if(a.n%8===3)reviewRole(a,t);
  a.view[a.id]={role:a.role,t};
  play(a);
  broadcast(a);
}
function proposeKey(a,idx){
  const nm=idx!=null?idx:pick(MOODS.map((_,i)=>i).filter(i=>i!==a.mood.idx));
  a.mood={v:a.mood.v+1,who:a.id,idx:nm}; log(`node ${a.id} proposes <b>${MOODS[nm].name}</b> (v${a.mood.v})`);
}
function reviewRole(a,t){
  const live=[{id:a.id,role:a.role}];
  for(const id in a.view){if(+id!==a.id&&t-a.view[id].t<2)live.push({id:+id,role:a.view[id].role});}
  const same=live.filter(x=>x.role===a.role);
  if(same.length>1){
    const missing=ROLES.filter(r=>!live.some(x=>x.role===r));
    if(missing.length&&a.id===Math.max(...same.map(x=>x.id))){
      const old=a.role;a.role=missing[a.id%missing.length];log(`node ${a.id}: ${old} → <b>${a.role}</b> (nobody was covering it)`);}
  }
}

// ---------- main loop ----------
setInterval(()=>{
  const t=now();
  for(const a of nodes){ if(a.alive&&t>=a.next)step(a,t); }
  for(let i=queue.length-1;i>=0;i--){const q=queue[i];if(t>=q.at){queue.splice(i,1);const r=nodes[q.to];if(r.alive&&!cut.has(ek(q.from,q.to)))receive(r,q.msg);}}
  while(packets.length&&packets[0].t1<t-0.05)packets.shift();
},8);
setInterval(()=>{ // storm mode: random link flapping and node deaths
  if(!storm)return;
  const e=pick(edges),k=ek(e[0],e[1]);
  if(cut.has(k)){if(rnd()<0.7)cut.delete(k);} else if(cut.size<8)cut.add(k);
  if(rnd()<0.15){const a=pick(nodes);if(nodes.filter(x=>x.alive).length>4||!a.alive)a.alive=!a.alive;}
},1500);

// ---------- scenario buttons ----------
const left=[0,1,2,3];
function splitNet(){edges.forEach(([a,b])=>{if((a<4)!==(b<4))cut.add(ek(a,b));});log('network split into two halves');}
document.getElementById('bSplit').onclick=splitNet;
document.getElementById('bDis').onclick=()=>{splitNet();
  const mx=Math.max(...nodes.map(n=>n.mood.v));
  proposeKey(nodes[1],(nodes[1].mood.idx+1)%MOODS.length);nodes[1].mood.v=mx+1;
  proposeKey(nodes[6],(nodes[6].mood.idx+2)%MOODS.length);nodes[6].mood.v=mx+1;
  log('both halves changed key independently. Now press Heal');};
document.getElementById('bHeal').onclick=()=>{cut.clear();nodes.forEach(n=>n.alive=true);log('links restored, everyone revived');};
document.getElementById('bKill').onclick=()=>{const l=nodes.filter(n=>n.alive);if(l.length>2){const a=pick(l);a.alive=false;log(`node ${a.id} (${a.role}) died`);}};
document.getElementById('bKey').onclick=()=>{const l=nodes.filter(n=>n.alive);if(l.length)proposeKey(pick(l));};
const bs=document.getElementById('bStorm');bs.onclick=()=>{storm=!storm;bs.classList.toggle('on',storm);};
const bm=document.getElementById('bMute');bm.onclick=()=>{muted=!muted;bm.classList.toggle('on',muted);bm.textContent=muted?'Unmute':'Mute';};
</script>
<script>
// ---------- UI + rendering ----------
const cv=document.getElementById('cv'),g=cv.getContext('2d');
const lossEl=document.getElementById('loss'),latEl=document.getElementById('lat');
lossEl.oninput=()=>{loss=lossEl.value/100;document.getElementById('lossV').textContent=lossEl.value;};
latEl.oninput=()=>{lat=latEl.value/1000;document.getElementById('latV').textContent=latEl.value;};
document.getElementById('go').onclick=()=>{initAudio();document.getElementById('start').style.display='none';log('band started. All 8 musicians begin out of sync and with random roles.');};
let W=0,H=0;
function resize(){const r=cv.getBoundingClientRect();const d=devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d;g.setTransform(d,0,0,d,0,0);W=r.width;H=r.height;}
addEventListener('resize',resize);resize();
const pos=i=>{const R=Math.min(W,H)*0.34,a=-Math.PI/2+2*Math.PI*i/N;return{x:W/2+R*Math.cos(a),y:H/2+R*Math.sin(a)};};
cv.addEventListener('click',ev=>{
  const r=cv.getBoundingClientRect(),x=ev.clientX-r.left,y=ev.clientY-r.top;
  for(const a of nodes){const p=pos(a.id);if(Math.hypot(p.x-x,p.y-y)<30){a.alive=!a.alive;log(`node ${a.id} ${a.alive?'revived':'killed'}`);return;}}
  let best=null,bd=14;
  for(const [a,b] of edges){const p=pos(a),q=pos(b);const dx=q.x-p.x,dy=q.y-p.y;let u=((x-p.x)*dx+(y-p.y)*dy)/(dx*dx+dy*dy);u=Math.max(0,Math.min(1,u));
    const d=Math.hypot(p.x+u*dx-x,p.y+u*dy-y);if(d<bd){bd=d;best=ek(a,b);}}
  if(best){if(cut.has(best))cut.delete(best);else cut.add(best);}
});
function draw(){
  const t=now();g.fillStyle='rgba(11,15,26,0.22)';g.fillRect(0,0,W,H); // trails
  // links
  for(const [a,b] of edges){const p=pos(a),q=pos(b),isCut=cut.has(ek(a,b));
    g.beginPath();g.moveTo(p.x,p.y);g.lineTo(q.x,q.y);
    if(isCut){g.setLineDash([4,7]);g.strokeStyle='#e5484d';g.lineWidth=1.5;}else{g.setLineDash([]);g.strokeStyle='#26325c';g.lineWidth=1.5;}
    g.stroke();g.setLineDash([]);
    if(isCut){const mx=(p.x+q.x)/2,my=(p.y+q.y)/2;g.strokeStyle='#e5484d';g.lineWidth=2;g.beginPath();g.moveTo(mx-6,my-6);g.lineTo(mx+6,my+6);g.moveTo(mx+6,my-6);g.lineTo(mx-6,my+6);g.stroke();}
  }
  // packets
  for(const k of packets){const u=(t-k.t0)/(k.t1-k.t0);if(u<0||u>1)continue;const p=pos(k.from),q=pos(k.to);
    g.fillStyle=k.col;g.globalAlpha=0.8;g.beginPath();g.arc(p.x+(q.x-p.x)*u,p.y+(q.y-p.y)*u,2.5,0,7);g.fill();g.globalAlpha=1;}
  // ripples (the "art")
  for(let i=ripples.length-1;i>=0;i--){const r=ripples[i],age=t-r.t;if(age>1.6){ripples.splice(i,1);continue;}
    const p=pos(r.id);g.strokeStyle=r.col;g.globalAlpha=0.5*(1-age/1.6);g.lineWidth=2;g.beginPath();g.arc(p.x,p.y,24+age*90,0,7);g.stroke();g.globalAlpha=1;}
  // nodes
  for(const a of nodes){
    const p=pos(a.id),col=RCOL[a.role],hue=MOODS[a.mood.idx].hue;
    a.pulse*=0.9;
    g.beginPath();g.arc(p.x,p.y,22+a.pulse*5,0,7);
    g.fillStyle=a.alive?col:'#2a2f45';g.globalAlpha=a.alive?0.25+0.6*a.pulse:1;g.fill();g.globalAlpha=1;
    g.lineWidth=3;g.strokeStyle=a.alive?`hsl(${hue} 80% 60%)`:'#444b66';g.stroke(); // ring colour = key it believes in
    if(a.alive){ // step phase arc: aligned arcs mean aligned clocks
      const ph=1-Math.max(0,Math.min(1,(a.next-t)/a.interval));
      g.strokeStyle='#fff';g.lineWidth=2;g.beginPath();g.arc(p.x,p.y,29,-Math.PI/2,-Math.PI/2+ph*2*Math.PI);g.stroke();}
    g.fillStyle=a.alive?'#0b0f1a':'#7d86a8';g.font='bold 13px system-ui';g.textAlign='center';g.textBaseline='middle';g.fillText(a.alive?a.id:'✕',p.x,p.y);
    const ang=-Math.PI/2+2*Math.PI*a.id/N,lx=p.x+Math.cos(ang)*60,ly=p.y+Math.sin(ang)*52;
    g.fillStyle=a.alive?col:'#667';g.font='12px system-ui';g.fillText(a.alive?a.role:'dead',lx,ly-8);
    g.fillStyle='#8a94b3';g.font='11px system-ui';g.fillText(a.alive?`${MOODS[a.mood.idx].name} · bar ${Math.floor(a.n/16)%1000}`:'',lx,ly+7);
  }
  requestAnimationFrame(draw);
}
draw();
// stats
setInterval(()=>{
  const live=nodes.filter(n=>n.alive);
  document.getElementById('sAlive').textContent=live.length+' / '+N;
  // components
  const seen=new Set();let comps=0;
  for(const a of live){if(seen.has(a.id))continue;comps++;const st=[a.id];seen.add(a.id);
    while(st.length){const u=st.pop();for(const v of adj[u])if(!seen.has(v)&&connected(u,v)){seen.add(v);st.push(v);}}}
  document.getElementById('sPart').textContent=comps;
  const roles=new Set(live.map(n=>n.role));document.getElementById('sRoles').textContent=roles.size+' / '+ROLES.length;
  if(live.length){
    const cnt={};live.forEach(n=>{const k=n.mood.v+'-'+n.mood.who;cnt[k]=(cnt[k]||0)+1;});
    const topMood=Object.keys(cnt).sort((x,y)=>cnt[y]-cnt[x])[0];
    const ns=live.map(n=>n.n).sort((x,y)=>x-y),med=ns[Math.floor(ns.length/2)];
    const ok=live.filter(n=>(n.mood.v+'-'+n.mood.who)===topMood&&Math.abs(n.n-med)<=1).length;
    document.getElementById('sCoh').textContent=Math.round(100*ok/live.length)+'%';
  }
},250);
</script>
</body></html>
